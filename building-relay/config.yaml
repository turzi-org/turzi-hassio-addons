# Turzi Edge Media — Home Assistant packaging of the building's media relay.
#
# DISPLAY NAME ONLY. The `slug` and the `image` below deliberately still say
# "building relay": changing the slug makes the Supervisor treat this as a
# DIFFERENT add-on, so it would install alongside the old one and the old
# /data -- which holds the enrollment credential and the tunnel credential --
# would be orphaned. Renaming the image would break the version-tag contract
# with turzi-apps' infra/building-relay/VERSION.
#
# This directory holds no Dockerfile, no nginx config and no entrypoint:
# the Supervisor pulls the SAME image that plain-Docker installs use,
# built from turzi-apps/infra/building-relay. It used to keep copies of
# all three, and they drifted — the /streams fix that stopped the relay
# handing over camera RTSP passwords landed in turzi-apps while this
# add-on went on serving them.
#
# `version` IS the image tag. The Supervisor pulls
# ghcr.io/turzi-org/building-relay:<version> and has no `latest`
# fallback, so this string must exactly match turzi-apps'
# infra/building-relay/VERSION, which is what the publish workflow tags.
# Bumping this line is how the add-on picks up a new image. Keep it
# quoted — unquoted 1.10 parses as the float 1.1.
name: Turzi Edge Media
version: "1.9.0"
slug: turzi_building_relay
description: Camera video for Turzi — served on your LAN, and out to the app through a connection this add-on opens itself. No port forwarding, no VPN.
url: https://github.com/turzi-org/turzi-hassio-addons

# Plain multi-arch manifest, no {arch} placeholder: the Supervisor pulls
# with an explicit platform and verifies the architecture it got, and
# this is the form the docs prefer. No tag here — the validator rejects
# one, because `version` above supplies it.
image: ghcr.io/turzi-org/building-relay

# Still required even with a prebuilt image, and still what decides
# whether the add-on is offered on a given machine at all.
arch:
  - amd64
  - aarch64

init: false
# Each request's hostname encodes which video server to reach, so the
# relay needs the building's LAN directly. This also makes any `ports:`
# mapping inert — the listening port is not remappable from the UI.
# No Supervisor access. Listing add-ons needs an elevated hassio_role -- manager
# rights over someone's Home Assistant, to read a list -- and it would only ever
# have found services installed AS add-ons. The relay is on the host network, so
# it probes the standard ports on 127.0.0.1 instead: no privileges, and it finds
# a plain Docker container or a bare install just as well.

host_network: true

options:
  api_url: ""
  provision_token: ""
  frigate_port: 5000
  go2rtc_port: 1984
schema:
  api_url: str
  provision_token: str?
  frigate_port: int
  go2rtc_port: int
