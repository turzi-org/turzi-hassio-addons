name: Turzi External System API
version: "2.1.0"
slug: turzi_external_api
description: REST API for external systems to read and operate Home Assistant entities over the Turzi Protocol, with a full action and state log
url: https://github.com/turzi-org/turzi-external-api
arch:
  - amd64
  - aarch64
init: false

# Read and operate entities through Home Assistant itself. The Supervisor
# proxies its API and accepts the add-on token, so there is no token to create
# and none to rotate.
homeassistant_api: true

# `want`, not `need`: the database can be pointed elsewhere with db_url, and
# `need` would refuse to start without a local MariaDB such a deployment does
# not have.
services:
  - mysql:want

# The operator's view, served through Home Assistant's ingress: it appears in
# the sidebar, HA authenticates it, and it is reachable ONLY that way. Its port
# is deliberately absent from `ports` below — the public listener carries the
# API for the integrator, and the log view must never appear on it.
ingress: true
ingress_port: 8099
panel_icon: mdi:boom-gate
panel_title: Gate log

ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: REST API for the external system (leave closed unless it needs LAN access)

options:
  house_id: ""
  api_keys: []
  allowed_entities: []
  allowed_domains: []
  database: turzi_external_api
  db_url: ""
  confirm_timeout_ms: 4000
  log_requests: false

schema:
  # A label recorded on every log row, identifying this building. It no longer
  # has to match anything: the add-on reads Home Assistant directly.
  house_id: str
  # "label:secret" per caller. The label is stamped on every command and shows
  # up in the log and in the HA logbook, so name it after the calling system.
  # The pattern enforces a secret of at least 16 characters, because this key
  # opens doors.
  api_keys:
    - match(^[A-Za-z0-9_.-]+:[^,]{16,}$)
  # Entity ids the external system may touch, e.g. cover.garage. Leave empty
  # and it can reach every entity the bridge exposes — on a real building that
  # is every door in it.
  allowed_entities:
    - match(^[a-z_]+\.[a-z0-9_]+$)
  allowed_domains:
    - str
  database: str
  # Set only to bypass Supervisor discovery, e.g. mysql://user:pass@host:3306/db
  db_url: str?
  confirm_timeout_ms: int(500,30000)
  log_requests: bool
